[project]
name = "advent"
version = "0.1.0"
description = "Advent of Code Solutions and Tools"
authors = [{ name = "gareth", email = "gaz@grufnet.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.8"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
behave = "^1.3.3"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "single"
# Indent with spaces(x4), rather than tabs.
indent-style = "space"
# Respect magic trailing commas.
skip-magic-trailing-comma = false
# Detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
#addopts = "-rA"
addopts = "-ra"
testpaths = ["tests", "src"]
filterwarnings = ["ignore::DeprecationWarning"]
