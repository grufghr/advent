[project]
name = "advent"
version = "0.1.0"
description = "Advent of Code Solutions and Tools"
authors = [{ name = "gareth", email = "gaz@grufnet.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
test = [
    "pytest>=9.0.2,<10",
    "behave>=1.3.3,<2",
]

[tool.uv]
default-groups = "all"

